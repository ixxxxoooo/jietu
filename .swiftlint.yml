# SwiftLint 配置：只作为「提示」，CI 里不阻塞（见 .github/workflows/ci.yml）。
included:
  - Jietu
  - JietuTests

excluded:
  - .build
  - dist
  # DEBUG 专用的命令行自检：长函数是脚本的天然形态，不做度量。
  - Jietu/Core/Diagnostics

disabled_rules:
  - line_length
  - identifier_name
  - type_name
  - todo
  - nesting
  - large_tuple
  - function_parameter_count
  - cyclomatic_complexity
  # 与现有代码风格冲突、纯格式类的规则（格式交给 .editorconfig 与 Xcode）
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - trailing_newline
  - orphaned_doc_comment

opt_in_rules:
  - empty_count

# 文件规模上限与仓库规范（~500 行）对齐。
file_length:
  warning: 500
  error: 700
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 80
  error: 200

force_cast: warning
force_try: warning
