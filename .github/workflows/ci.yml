name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Build (Debug)
        run: |
          xcodebuild -project Jietu.xcodeproj -scheme Jietu -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build build \
            | xcbeautify --renderer github-actions || true

      - name: Test
        run: |
          xcodebuild -project Jietu.xcodeproj -scheme Jietu -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build test \
            | xcbeautify --renderer github-actions || true
