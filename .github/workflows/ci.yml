name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：CI 只需要读代码。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 脚本与发版元数据的静态检查：不需要 macOS 26，用便宜的 runner。
  lint:
    name: Lint scripts & release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck -S warning Scripts/*.sh

      # 工程版本与 CHANGELOG 最新条目必须一致，否则尽早失败。
      - name: Release metadata is consistent
        run: bash Scripts/check-release.sh

  swiftlint:
    name: SwiftLint (advisory)
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    # 风格提示，不阻塞合并：违规以注解形式出现在 PR 上。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: SwiftLint
        run: swiftlint lint --lenient --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    # 工程的部署目标是 macOS 26，必须跑在 macOS 26 的 runner 上：
    # macos-15 上既没有 Xcode 27，测试宿主也起不来（deployment target 对不上）。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using ${XCODE}"
          sudo xcode-select -s "$XCODE"

      # pipefail 不能省：否则管道的状态取的是 xcbeautify（它总是返回 0），
      # 构建失败也会判成功——之前 CI 一直显示绿，就是这么来的。
      - name: Build (Debug)
        run: |
          set -o pipefail
          xcodebuild -project Jietu.xcodeproj -scheme Jietu -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Automatic \
            build \
            | xcbeautify --renderer github-actions

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project Jietu.xcodeproj -scheme Jietu -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Automatic \
            test \
            | xcbeautify --renderer github-actions

      # 失败时留下结果包，方便下载后用 Xcode 打开定位。
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
