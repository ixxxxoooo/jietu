name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发只做「构建 + 上传 artifact」，不建 release：
  # 用来在真机 runner 上验证打包流程，通过了再打 tag。
  workflow_dispatch:

# 默认只读；只有真正发布的 job 才提升到 contents: write。
permissions:
  contents: read

jobs:
  # 闸门 1：tag、工程版本、CHANGELOG 必须是同一个版本号，否则不浪费 macOS 分钟数。
  verify:
    name: Verify version & changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check release metadata
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash Scripts/check-release.sh "$GITHUB_REF_NAME"
          else
            bash Scripts/check-release.sh
          fi

  # 闸门 2：测试不过不出包（和 CI 同一条命令）。
  test:
    name: Test
    needs: verify
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          # 优先镜像默认的正式版 Xcode 27；没有再取任一 Xcode 27，最后才退回 Xcode.app。
          # （pipefail 下 ls 没匹配会让整行失败，所以每条都带 `|| true`。）
          XCODE=/Applications/Xcode_27.app
          [ -d "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          echo "Using ${XCODE}"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project Jietu.xcodeproj -scheme Jietu -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Automatic \
            test \
            | xcbeautify --renderer github-actions

  build-and-release:
    name: Build DMG & Create Release
    needs: [verify, test]
    permissions:
      contents: write
    # 工程的部署目标是 macOS 26，构建/签名/排版/打包全部交给 Scripts/build-dmg.sh。
    # runner 上没有本机的自签名证书「Jietu」，所以下面那步先把证书从 secrets 导进
    # 临时钥匙串：build-dmg.sh 找不到证书就拒绝产出 ad-hoc 签名的 DMG。
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          set -euo pipefail
          # 优先镜像默认的正式版 Xcode 27；没有再取任一 Xcode 27，最后才退回 Xcode.app。
          # （pipefail 下 ls 没匹配会让整行失败，所以每条都带 `|| true`。）
          XCODE=/Applications/Xcode_27.app
          [ -d "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          echo "Using ${XCODE}"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # 签名身份必须**和本地、和历史版本一致**：TCC（屏幕录制等）把授权记在 App 的
      # 代码签名身份上。ad-hoc 签名的身份是 cdhash（这一个二进制的指纹），每次构建都变，
      # 用户每次升级都要重新授权一遍；用同一张证书签，要求就一直是
      # `identifier + certificate leaf`，重装 / 升级都认同一份授权。
      #
      # 一次性配置（见 AGENTS.md「发布」一节）：
      #   本机导出 → JIETU_CERT_P12_BASE64、JIETU_CERT_P12_PASSWORD 两个 secrets
      #
      # 打 tag 的正式发布**必须有**证书：ad-hoc 签出来的 App，签名身份每次构建都变，
      # 用户每升级一次就要重新授权一次屏幕录制。手动 workflow_dispatch 只是验打包流程，
      # 允许降级（相当于 JIETU_ALLOW_ADHOC=1），但要显眼地警告。
      - name: Import signing identity
        env:
          P12_BASE64: ${{ secrets.JIETU_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.JIETU_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              echo "::error::secrets 里没有 JIETU_CERT_P12_BASE64。没有这张证书只能 ad-hoc 签名，"
              echo "::error::那样用户每升级一次就要重新授权一次屏幕录制（见 AGENTS.md「发布」一节）。"
              exit 1
            fi
            echo "::warning::没有签名证书，本次（手动触发、非发布）退回 ad-hoc 签名，产物不适合发给用户"
            echo "JIETU_ALLOW_ADHOC=1" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/jietu-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/jietu.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/jietu.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # codesign 用私钥时要过这道 ACL，少了它就会卡在「钥匙串授权」上。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/jietu.p12"
          security find-identity -p codesigning | grep '"Jietu"' \
            || { echo "::error::导入后仍然找不到「Jietu」身份"; exit 1; }

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 不要再单独 xcodebuild 一次：那样会绕开 build-dmg.sh 里的签名身份守门。
      - name: Build DMG
        run: bash Scripts/build-dmg.sh

      # 私钥只在这个 job 里活着：钥匙串连同临时文件一起删掉。
      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/jietu-signing.keychain-db" || true

      # SHA256SUMS.txt 与 DMG 放在同一目录，用户下载后可直接 `shasum -a 256 -c SHA256SUMS.txt`。
      - name: Compute checksums
        id: checksum
        run: |
          set -euo pipefail
          DMG_PATH="$(ls dist/Jietu-*.dmg)"
          # 在线更新包：App 内「检查更新」下载它（命名约定见 Scripts/build-dmg.sh），
          # 同名 .sha256 一并上传，缺一个就让发布失败，免得发出一个更新不了的版本。
          ZIP_PATH="$(ls dist/Jietu-*-macOS.zip)"
          [ -f "$ZIP_PATH.sha256" ] || { echo "::error::缺少 $ZIP_PATH.sha256"; exit 1; }
          ( cd dist && shasum -a 256 "$(basename "$DMG_PATH")" "$(basename "$ZIP_PATH")" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      # Release 正文 = 本版本的 CHANGELOG 小节 + 安装与权限说明。
      - name: Compose release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          [ -s "$RUNNER_TEMP/changes.md" ] \
            || { echo "::error::CHANGELOG 里找不到 $VERSION 的内容"; exit 1; }
          {
            echo "## Jietu $VERSION"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            cat <<'NOTES'
          ### Installation

          1. Download the DMG below and (optionally) verify it with `SHA256SUMS.txt`:
             `shasum -a 256 -c SHA256SUMS.txt`
          2. Open the DMG and drag **Jietu.app** onto the **Applications** folder.
          3. Before first launch, remove the quarantine flag in Terminal
             (the release is self-signed, not notarized):
             ```
             xattr -dr com.apple.quarantine /Applications/Jietu.app
             ```
             The DMG also ships `安装说明.txt` — the same line, ready to copy.

          ### Permissions

          - **Screen Recording** (required): System Settings › Privacy & Security ›
            Screen & System Audio Recording → drag Jietu in (or click **+** and pick it)
            → turn it on → then restart Jietu.
            If **Jietu.app is already listed but the app still reports "not granted"**,
            select that row, remove it with **−**, add it again, and restart Jietu.
          - **Accessibility** (optional, for auto-scroll): System Settings › Privacy & Security › Accessibility → add Jietu.

          ### Updating

          Already installed? Use **Check for Updates…** in the menu bar — Jietu downloads
          `Jietu-<version>-macOS.zip`, verifies its SHA-256 and code signature, replaces itself and restarts.
          Your Screen Recording permission is kept.
          NOTES
          } > release-notes.md
          cat release-notes.md

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Jietu-${{ github.ref_name }}
          path: |
            ${{ steps.checksum.outputs.dmg_path }}
            ${{ steps.checksum.outputs.zip_path }}
            ${{ steps.checksum.outputs.zip_path }}.sha256
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Jietu ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            ${{ steps.checksum.outputs.dmg_path }}
            ${{ steps.checksum.outputs.zip_path }}
            ${{ steps.checksum.outputs.zip_path }}.sha256
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
