name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发只做「构建 + 上传 artifact」，不建 release：
  # 用来在真机 runner 上验证打包流程，通过了再打 tag。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build DMG & Create Release
    # 工程的部署目标是 macOS 26；runner 上也没有本机的自签名证书，
    # 所以构建/签名/排版/打包全部交给 Scripts/build-dmg.sh（它会自己退回 ad-hoc 签名）。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XCODE" ] || XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using ${XCODE}"
          sudo xcode-select -s "$XCODE"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 不要再单独 xcodebuild 一次：那样会绕开 build-dmg.sh 里的签名回退
      # （runner 没有自签名证书「Jietu」→ 改用 ad-hoc），之前三次 Release 就挂在这里。
      - name: Build DMG
        run: bash Scripts/build-dmg.sh

      - name: Compute checksums
        id: checksum
        run: |
          DMG_PATH="$(ls dist/Jietu-*.dmg)"
          SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"
          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Jietu-${{ github.ref_name }}
          path: ${{ steps.checksum.outputs.dmg_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Jietu ${{ steps.version.outputs.version }}
          body: |
            ## Jietu ${{ steps.version.outputs.version }}

            ### Installation

            1. Download `${{ steps.checksum.outputs.dmg_name }}` below.
            2. Open the DMG and drag **Jietu.app** onto the **Applications** folder.
            3. First launch: **right-click → Open → Open** (the app is self-signed, so a
               plain double-click is blocked). Or run the bundled **Fix Gatekeeper.app**
               the same way, or clear the flag yourself:
               `xattr -dr com.apple.quarantine /Applications/Jietu.app`

            ### Permissions

            - **Screen Recording** (required): System Settings › Privacy & Security › Screen Recording → add Jietu → restart app.
            - **Accessibility** (optional, for auto-scroll): System Settings › Privacy & Security › Accessibility → add Jietu.

            ### Checksum

            ```
            SHA-256: ${{ steps.checksum.outputs.sha256 }}
            ```
          files: ${{ steps.checksum.outputs.dmg_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
